<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>筛 · 知乎同步接收器</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --paper: #f6f1e6;
      --card: #fbf8f0;
      --ink: #1d1b17;
      --ink-soft: #5f594d;
      --muted: #8b8375;
      --line: #d9d3c5;
      --accent: #c84630;
      --ok: #2e6b45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Serif SC", "Songti SC", "GB Song", Georgia, serif;
    }
    .receiver {
      width: min(420px, 100%);
      border: 1px solid var(--ink);
      background: var(--card);
      box-shadow: 0 18px 50px rgba(29, 27, 23, 0.18);
      padding: 22px 24px 20px;
    }
    .kicker {
      margin: 0;
      color: var(--accent);
      font-family: ui-monospace, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
    }
    h1 {
      margin: 8px 0 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .status {
      min-height: 44px;
      margin: 14px 0 0;
      color: var(--ink-soft);
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.7;
    }
    .status.is-error { color: var(--accent); }
    .status.is-ok { color: var(--ok); }
    .bar {
      height: 3px;
      margin-top: 12px;
      background: #e7e1d4;
      overflow: hidden;
    }
    .bar span {
      display: block;
      width: 2%;
      height: 100%;
      background: var(--accent);
      transition: width 0.25s ease;
    }
    .bar.is-ok span { background: var(--ok); }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0 0;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-family: ui-monospace, Consolas, monospace;
    }
    .stats div { min-width: 0; }
    .stats dt {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.08em;
    }
    .stats dd {
      margin: 3px 0 0;
      font-size: 20px;
    }
    .note {
      margin: 16px 0 0;
      color: var(--muted);
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      font-size: 11px;
      line-height: 1.7;
    }
    .actions { margin-top: 14px; }
    .actions a {
      display: inline-block;
      border: 1px solid var(--ink);
      padding: 6px 12px;
      color: var(--ink);
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      font-size: 12px;
      text-decoration: none;
    }
    .actions a:hover { background: var(--ink); color: var(--card); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="receiver">
    <p class="kicker">SIFT · ZHIHU BRIDGE</p>
    <h1>知乎同步接收器</h1>
    <p class="status" id="bridge-status" role="status">正在连接筛…</p>
    <div class="bar" id="bridge-bar"><span></span></div>
    <dl class="stats" id="bridge-stats" hidden>
      <div><dt>关注者</dt><dd id="stat-creators">0</dd></div>
      <div><dt>更新</dt><dd id="stat-items">0</dd></div>
    </dl>
    <p class="note">数据只写入这台电脑。同步完成后这个窗口会自动关闭；如果它没有关闭，可以直接关掉。</p>
    <div class="actions"><a href="/" target="_blank" rel="noopener">打开筛 →</a></div>
  </main>
  <script src="/zhihu-bridge.js"></script>
</body>
</html>
